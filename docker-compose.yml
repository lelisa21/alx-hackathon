services:
  db:
    image: postgres:17-alpine
    profiles:
      - local
    restart: unless-stopped
    environment:
      POSTGRES_DB: dimts
      POSTGRES_USER: dimts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - dimts-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimts -d dimts"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    build:
      context: .
      target: api
    profiles:
      - local
    restart: unless-stopped
    # Provider credentials are referenced by name (AI_PROVIDERS[].credentialRef),
    # so pass the local .env through; the explicit values below take precedence.
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DATABASE_URL: postgres://dimts:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/dimts
      DATABASE_URL_DIRECT: postgres://dimts:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/dimts
      ENC_KEY: ${ENC_KEY:?Set ENC_KEY in .env}
      HASH_KEY: ${HASH_KEY:?Set HASH_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      HOST_ORIGINS: ${HOST_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOCAL_WIDGET_KEY: ${LOCAL_WIDGET_KEY:-local-widget-public-id}
      LTI_PLATFORMS: "${LTI_PLATFORMS:-[]}"
      DEFAULT_LANG: ${DEFAULT_LANG:-en}
      PREVIEW_LANGS: ${PREVIEW_LANGS:-}
      STT_ENGINE: ${STT_ENGINE:-none}
      TTS_ENGINE: ${TTS_ENGINE:-none}
      VOICE_PREVIEW: ${VOICE_PREVIEW:-false}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_SECRET: ${TELEGRAM_SECRET:-}
      JOBS_RELAY_URL: ${JOBS_RELAY_URL:-}
      JOBS_RELAY_SECRET: ${JOBS_RELAY_SECRET:-}
      JOBS_RELAY_CHANNELS: ${JOBS_RELAY_CHANNELS:-}
      JOBS_ALERT_INTERVAL_MS: ${JOBS_ALERT_INTERVAL_MS:-0}
      SMS_MODE: ${SMS_MODE:-simulator}
      SMS_GATEWAY_SECRET: ${SMS_GATEWAY_SECRET:-}
      SMS_DAILY_LIMIT: ${SMS_DAILY_LIMIT:-20}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      SMS_CALLBACK_URL: ${SMS_CALLBACK_URL:-}
      SMS_CALLBACK_SECRET: ${SMS_CALLBACK_SECRET:-}
      HELPER_HOURS: ${HELPER_HOURS:-}
      HELP_WAIT_TIMEOUT_MS: ${HELP_WAIT_TIMEOUT_MS:-300000}
      TURN_APP: ${TURN_APP:-}
      TURN_API_KEY: ${TURN_API_KEY:-}
      CONTENT_BASE_URL: ${CONTENT_BASE_URL:-http://localhost:5173/learn/}
      CONTENT_PATH: ${CONTENT_PATH:-content/savanna}
      PUBLIC_SOURCES: ${PUBLIC_SOURCES:-[]}
      SOURCE_SYNC_INTERVAL_MS: ${SOURCE_SYNC_INTERVAL_MS:-300000}
      AI_PROVIDER: ${AI_PROVIDER:-offline}
      AI_LADDER: ${AI_LADDER:-offline}
      AI_PROVIDERS: ${AI_PROVIDERS:-[]}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-512}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_CONSENT_VERSION: ${AI_CONSENT_VERSION:-remote-ai-v1}
      LANGUAGE_DETECTION_CONFIDENCE: ${LANGUAGE_DETECTION_CONFIDENCE:-0.25}
    ports:
      - "127.0.0.1:${COMPOSE_API_PORT:-3000}:3000"
    command:
      - sh
      - -c
      - >-
        node packages/api/dist/db/local-bootstrap.js &&
        node packages/grounding/dist/cli.js "$$CONTENT_PATH" --if-changed &&
        exec node packages/api/dist/server.js
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - backend
      - edge

  widget:
    build:
      context: .
      target: web
    profiles:
      - local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      LOCAL_WIDGET_KEY: ${LOCAL_WIDGET_KEY:-local-widget-public-id}
      # API base the injected host loader uses; nginx proxies /v1 locally.
      PUBLIC_API: /v1
      # Public bot username shown on the demo page; empty hides the Telegram card.
      PUBLIC_TELEGRAM_BOT: ${PUBLIC_TELEGRAM_BOT:-}
      NGINX_ENVSUBST_TEMPLATE_DIR: /usr/share/nginx/html/templates
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html
    ports:
      - "127.0.0.1:${COMPOSE_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - edge

  seed:
    build:
      context: .
      target: api
    profiles:
      - seed
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dimts:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/dimts
      DATABASE_URL_DIRECT: postgres://dimts:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/dimts
      SEED_HELPER_TOKEN: ${SEED_HELPER_TOKEN:?Set SEED_HELPER_TOKEN in .env}
      DEFAULT_LANG: ${DEFAULT_LANG:-en}
      CONTENT_BASE_URL: ${CONTENT_BASE_URL:-http://localhost:5173/learn/}
    command:
      - sh
      - -c
      - node packages/grounding/dist/cli.js content/savanna && node scripts/seed.mjs
    networks:
      - backend

  scheduler:
    build:
      context: .
      target: api
    profiles:
      - scheduler
    depends_on:
      api:
        condition: service_healthy
    environment:
      SCHEDULER_API_URL: http://api:3000
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
    command: ["node", "scripts/local-scheduler.mjs"]
    networks:
      - backend

  ollama:
    image: ollama/ollama:0.40.16
    profiles:
      - local-ai
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
      - edge

volumes:
  dimts-postgres:
  ollama-models:

networks:
  backend:
    internal: true
  edge:
