services:
  db:
    image: postgres:17-alpine
    profiles:
      - local
    restart: unless-stopped
    environment:
      POSTGRES_DB: dimts
      POSTGRES_USER: dimts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - dimts-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimts -d dimts"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    build:
      context: .
      target: api
    profiles:
      - local
    restart: unless-stopped
    # Provider credentials are referenced by name (DIMTS_AI_PROVIDERS[].credentialRef),
    # so pass the local .env through; the explicit values below take precedence.
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DATABASE_URL: postgres://dimts:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/dimts
      DATABASE_URL_DIRECT: postgres://dimts:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/dimts
      DIMTS_ENC_KEY: ${DIMTS_ENC_KEY:?Set DIMTS_ENC_KEY in .env}
      DIMTS_HASH_KEY: ${DIMTS_HASH_KEY:?Set DIMTS_HASH_KEY in .env}
      DIMTS_JWT_SECRET: ${DIMTS_JWT_SECRET:?Set DIMTS_JWT_SECRET in .env}
      DIMTS_CRON_SECRET: ${DIMTS_CRON_SECRET:?Set DIMTS_CRON_SECRET in .env}
      DIMTS_HOST_ORIGINS: ${DIMTS_HOST_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DIMTS_LOCAL_WIDGET_KEY: ${DIMTS_LOCAL_WIDGET_KEY:-local-widget-public-id}
      DIMTS_LTI_PLATFORMS: "${DIMTS_LTI_PLATFORMS:-[]}"
      DIMTS_DEFAULT_LANG: ${DIMTS_DEFAULT_LANG:-en}
      DIMTS_PREVIEW_LANGS: ${DIMTS_PREVIEW_LANGS:-}
      DIMTS_STT_ENGINE: ${DIMTS_STT_ENGINE:-none}
      DIMTS_TTS_ENGINE: ${DIMTS_TTS_ENGINE:-none}
      DIMTS_VOICE_PREVIEW: ${DIMTS_VOICE_PREVIEW:-false}
      DIMTS_RETENTION_HOURS: ${DIMTS_RETENTION_HOURS:-24}
      DIMTS_TELEGRAM_MODE: ${DIMTS_TELEGRAM_MODE:-}
      DIMTS_TELEGRAM_TOKEN: ${DIMTS_TELEGRAM_TOKEN:-}
      DIMTS_TELEGRAM_SECRET: ${DIMTS_TELEGRAM_SECRET:-}
      DIMTS_JOBS_RELAY_URL: ${DIMTS_JOBS_RELAY_URL:-}
      DIMTS_JOBS_RELAY_SECRET: ${DIMTS_JOBS_RELAY_SECRET:-}
      DIMTS_JOBS_RELAY_CHANNELS: ${DIMTS_JOBS_RELAY_CHANNELS:-}
      DIMTS_JOBS_ALERT_INTERVAL_MS: ${DIMTS_JOBS_ALERT_INTERVAL_MS:-0}
      DIMTS_SMS_MODE: ${DIMTS_SMS_MODE:-simulator}
      DIMTS_SMS_GATEWAY_SECRET: ${DIMTS_SMS_GATEWAY_SECRET:-}
      DIMTS_SMS_DAILY_LIMIT: ${DIMTS_SMS_DAILY_LIMIT:-20}
      DIMTS_SMS_GATEWAY_URL: ${DIMTS_SMS_GATEWAY_URL:-}
      DIMTS_SMS_GATEWAY_TOKEN: ${DIMTS_SMS_GATEWAY_TOKEN:-}
      DIMTS_SMS_CALLBACK_URL: ${DIMTS_SMS_CALLBACK_URL:-}
      DIMTS_SMS_CALLBACK_SECRET: ${DIMTS_SMS_CALLBACK_SECRET:-}
      DIMTS_HELPER_HOURS: ${DIMTS_HELPER_HOURS:-}
      DIMTS_HELP_WAIT_TIMEOUT_MS: ${DIMTS_HELP_WAIT_TIMEOUT_MS:-300000}
      DIMTS_TURN_APP: ${DIMTS_TURN_APP:-}
      DIMTS_TURN_API_KEY: ${DIMTS_TURN_API_KEY:-}
      DIMTS_CONTENT_BASE_URL: ${DIMTS_CONTENT_BASE_URL:-http://localhost:5173/learn/}
      DIMTS_CONTENT_PATH: ${DIMTS_CONTENT_PATH:-content/savanna}
      DIMTS_PUBLIC_SOURCES: ${DIMTS_PUBLIC_SOURCES:-[]}
      DIMTS_SOURCE_SYNC_INTERVAL_MS: ${DIMTS_SOURCE_SYNC_INTERVAL_MS:-300000}
      DIMTS_AI_PROVIDER: ${DIMTS_AI_PROVIDER:-offline}
      DIMTS_AI_LADDER: ${DIMTS_AI_LADDER:-offline}
      DIMTS_AI_PROVIDERS: ${DIMTS_AI_PROVIDERS:-[]}
      DIMTS_AI_MAX_TOKENS: ${DIMTS_AI_MAX_TOKENS:-512}
      DIMTS_AI_TEMPERATURE: ${DIMTS_AI_TEMPERATURE:-0.2}
      DIMTS_AI_CONSENT_VERSION: ${DIMTS_AI_CONSENT_VERSION:-remote-ai-v1}
      DIMTS_LANGUAGE_DETECTION_CONFIDENCE: ${DIMTS_LANGUAGE_DETECTION_CONFIDENCE:-0.25}
    ports:
      - "127.0.0.1:${DIMTS_COMPOSE_API_PORT:-3000}:3000"
    command:
      - sh
      - -c
      - >-
        node packages/api/dist/db/local-bootstrap.js &&
        node packages/grounding/dist/cli.js "$$DIMTS_CONTENT_PATH" --if-changed &&
        exec node packages/api/dist/server.js
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - backend
      - edge

  widget:
    build:
      context: .
      target: web
    profiles:
      - local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DIMTS_LOCAL_WIDGET_KEY: ${DIMTS_LOCAL_WIDGET_KEY:-local-widget-public-id}
      # API base the injected host loader uses; nginx proxies /v1 locally.
      DIMTS_PUBLIC_API: /v1
      # Public bot username shown on the demo page; empty hides the Telegram card.
      DIMTS_PUBLIC_TELEGRAM_BOT: ${DIMTS_PUBLIC_TELEGRAM_BOT:-}
      NGINX_ENVSUBST_TEMPLATE_DIR: /usr/share/nginx/html/templates
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html
    ports:
      - "127.0.0.1:${DIMTS_COMPOSE_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - edge

  seed:
    build:
      context: .
      target: api
    profiles:
      - seed
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dimts:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/dimts
      DATABASE_URL_DIRECT: postgres://dimts:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/dimts
      DIMTS_SEED_HELPER_TOKEN: ${DIMTS_SEED_HELPER_TOKEN:?Set DIMTS_SEED_HELPER_TOKEN in .env}
      DIMTS_DEFAULT_LANG: ${DIMTS_DEFAULT_LANG:-en}
      DIMTS_CONTENT_BASE_URL: ${DIMTS_CONTENT_BASE_URL:-http://localhost:5173/learn/}
    command:
      - sh
      - -c
      - node packages/grounding/dist/cli.js content/savanna && node scripts/seed.mjs
    networks:
      - backend

  scheduler:
    build:
      context: .
      target: api
    profiles:
      - scheduler
    depends_on:
      api:
        condition: service_healthy
    environment:
      DIMTS_SCHEDULER_API_URL: http://api:3000
      DIMTS_CRON_SECRET: ${DIMTS_CRON_SECRET:?Set DIMTS_CRON_SECRET in .env}
    command: ["node", "scripts/local-scheduler.mjs"]
    networks:
      - backend

  ollama:
    image: ollama/ollama:0.40.16
    profiles:
      - local-ai
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${DIMTS_OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
      - edge

volumes:
  dimts-postgres:
  ollama-models:

networks:
  backend:
    internal: true
  edge:
