services:
  db:
    image: postgres:17-alpine
    profiles:
      - local
    restart: unless-stopped
    environment:
      POSTGRES_DB: dimts
      POSTGRES_USER: dimts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dimts-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimts -d dimts"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dimts-postgres:
