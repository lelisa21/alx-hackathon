openapi: 3.1.0
info:
  title: Dimts API
  version: 0.1.0
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
    helperBearer:
      type: http
      scheme: bearer
    hostKey:
      type: apiKey
      in: header
      name: X-Dimts-Key
    cronBearer:
      type: http
      scheme: bearer
  schemas:
    AskRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
        clientMsgId:
          type: string
          minLength: 8
          maxLength: 64
        lang:
          type: string
          minLength: 2
          maxLength: 8
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: At most 1000 Unicode code points
        via:
          type: string
          enum: &a6
            - text
            - voice
            - sms
            - telegram
        simple:
          type: boolean
          default: false
      required:
        - sessionId
        - clientMsgId
        - lang
        - text
        - via
      additionalProperties: false
    FeedbackRequest:
      type: object
      properties:
        replyId:
          type: string
          minLength: 1
          maxLength: 128
        helpful:
          type: boolean
      required:
        - replyId
        - helpful
      additionalProperties: false
    FeedbackResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    Reply:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: &a7
            - answer
            - notfound
            - escalation
            - distress
            - system
        text:
          type: string
        lang:
          type: string
        dir:
          type: string
          enum: &a8
            - ltr
            - rtl
        citations:
          type: array
          items:
            type: object
            properties:
              passageId:
                type: string
              label:
                type: string
              url:
                type: string
                format: uri
              sourceLang:
                type: string
              sourceType:
                type: string
                enum: &a9
                  - course
                  - job
              timestamp:
                type: number
            required:
              - passageId
              - label
              - url
              - sourceLang
              - sourceType
            additionalProperties: false
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: &a10
                  - help
                  - more
                  - open_source
                  - subscribe_jobs
                  - language
                  - retry
              label:
                type: string
            required:
              - type
              - label
            additionalProperties: false
        audioUrl:
          type: string
          format: uri
        contentVersion:
          type: string
      required:
        - id
        - kind
        - text
        - lang
        - dir
        - citations
        - actions
        - contentVersion
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: number
        code:
          type: string
          enum: &a3
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - payload_too_large
            - internal
        messageKey:
          type: string
      required:
        - type
        - title
        - status
        - code
        - messageKey
      additionalProperties: false
    SessionRequest:
      type: object
      properties:
        lang:
          type: string
          minLength: 2
          maxLength: 8
        channel:
          type: string
          enum: &a5
            - web
            - api
          default: web
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
        resumeToken:
          type: string
          minLength: 20
          maxLength: 100
        cloudOk:
          type: boolean
        consentVersion:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    SessionResponse:
      type: object
      properties:
        sessionId:
          type: string
        sessionToken:
          type: string
        resumeToken:
          type: string
        lang:
          type: string
        cloudOk:
          type: boolean
        consentVersion:
          type:
            - string
            - "null"
      required:
        - sessionId
        - sessionToken
        - resumeToken
        - lang
        - cloudOk
        - consentVersion
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        db:
          type: boolean
        version:
          type: string
        contentVersion:
          type: string
        provider:
          type: string
        ladder:
          type: array
          items:
            type: string
      required:
        - ok
        - db
        - version
        - contentVersion
        - provider
        - ladder
      additionalProperties: false
    HelperLoginRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
      required:
        - token
      additionalProperties: false
    HelperLoginResponse:
      type: object
      properties:
        jwt:
          type: string
      required:
        - jwt
      additionalProperties: false
    HelpCreateRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
        includeSummary:
          type: boolean
      required:
        - sessionId
        - includeSummary
      additionalProperties: false
    HelpCreateResponse:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum:
            - waiting
      required:
        - id
        - status
      additionalProperties: false
    HelpQueueResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              lang:
                type: string
                minLength: 2
                maxLength: 35
              channel:
                type: string
                enum: &a11
                  - web
                  - api
              createdAt:
                type: string
                format: date-time
              summary:
                type:
                  - array
                  - "null"
                items:
                  type: string
                  maxLength: 2000
                maxItems: 3
            required:
              - id
              - lang
              - channel
              - createdAt
              - summary
            additionalProperties: false
      required:
        - requests
      additionalProperties: false
    HelpBlockResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    HelpClaimResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    LanguageList:
      type: object
      properties:
        languages:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              nameNative:
                type: string
              nameEn:
                type: string
              script:
                type: string
              dir:
                type: string
                enum: &a1
                  - ltr
                  - rtl
              status:
                type: string
                enum: &a2
                  - live
                  - beta
                  - draft
              stt:
                type: boolean
              tts:
                type: boolean
            required:
              - code
              - nameNative
              - nameEn
              - script
              - dir
              - status
              - stt
              - tts
            additionalProperties: false
      required:
        - languages
      additionalProperties: false
    LocaleUI:
      type: object
      additionalProperties:
        type: string
    LocaleFAQ:
      type: object
      properties:
        lang:
          type: string
          minLength: 2
          maxLength: 35
        dir:
          type: string
          enum: &a4
            - ltr
            - rtl
        contentVersion:
          type: string
          minLength: 1
          maxLength: 256
        reviewedOn:
          type:
            - string
            - "null"
          pattern: ^\d{4}-\d{2}-\d{2}$
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              question:
                type: string
                minLength: 1
                maxLength: 1000
              answer:
                type: string
                minLength: 1
                maxLength: 4000
              citations:
                type: array
                items:
                  type: object
                  properties:
                    passageId:
                      type: string
                      minLength: 1
                      maxLength: 256
                    label:
                      type: string
                      minLength: 1
                      maxLength: 1000
                    url:
                      type: string
                      maxLength: 4000
                      format: uri
                      pattern: ^https?:\/\/
                    sourceLang:
                      type: string
                      minLength: 1
                      maxLength: 35
                    sourceType:
                      type: string
                      enum:
                        - course
                    timestamp:
                      type: number
                  required:
                    - passageId
                    - label
                    - url
                    - sourceLang
                    - sourceType
                  additionalProperties: false
                minItems: 1
                maxItems: 1
            required:
              - id
              - question
              - answer
              - citations
            additionalProperties: false
          maxItems: 100
      required:
        - lang
        - dir
        - contentVersion
        - reviewedOn
        - items
      additionalProperties: false
  parameters: {}
paths:
  /v1/docs:
    get:
      summary: Open API documentation
      responses:
        "200":
          description: API documentation page
          content:
            text/html:
              schema:
                type: string
  /v1/health:
    get:
      summary: Health and dependency status
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  db:
                    type: boolean
                  version:
                    type: string
                  contentVersion:
                    type: string
                  provider:
                    type: string
                  ladder:
                    type: array
                    items:
                      type: string
                required:
                  - ok
                  - db
                  - version
                  - contentVersion
                  - provider
                  - ladder
                additionalProperties: false
  /v1/languages:
    get:
      summary: List available language packs
      responses:
        "200":
          description: Available languages
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        nameNative:
                          type: string
                        nameEn:
                          type: string
                        script:
                          type: string
                        dir:
                          type: string
                          enum: *a1
                        status:
                          type: string
                          enum: *a2
                        stt:
                          type: boolean
                        tts:
                          type: boolean
                      required:
                        - code
                        - nameNative
                        - nameEn
                        - script
                        - dir
                        - status
                        - stt
                        - tts
                      additionalProperties: false
                required:
                  - languages
                additionalProperties: false
  /v1/locales/{code}/ui:
    get:
      summary: Get localized UI strings
      parameters:
        - schema:
            type: string
          required: true
          name: code
          in: path
        - schema:
            type: string
            enum:
              - "0"
              - "1"
          required: false
          name: lang_preview
          in: query
      responses:
        "200":
          description: UI strings resolved through the configured fallback chain
          headers:
            X-Dimts-Locale-Fallback:
              description: 1 when any UI string came from a fallback pack, otherwise 0
              schema:
                type: string
                enum:
                  - "0"
                  - "1"
            ETag:
              description: Validator for the resolved strings and fallback signal
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "304":
          description: Not modified; retains the X-Dimts-Locale-Fallback header
          headers:
            X-Dimts-Locale-Fallback:
              schema:
                type: string
                enum:
                  - "0"
                  - "1"
        "404":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
  /v1/locales/{code}/faq:
    get:
      summary: Get reviewed, actively cited offline FAQ content
      description: Draft or unreviewed packs return an empty list. Preview never
        authorizes draft answers. Unresolved or ambiguous source references are
        omitted. No identity or session is required.
      parameters:
        - schema:
            type: string
          required: true
          name: code
          in: path
        - schema:
            type: string
            enum:
              - "0"
              - "1"
          required: false
          name: lang_preview
          in: query
        - schema:
            type: string
          required: false
          name: if-none-match
          in: header
      responses:
        "200":
          description: Reviewed FAQ with canonical active passage citations, or an honest
            empty list
          headers:
            ETag:
              description: Validator for the complete representation including content version
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: public, max-age=0, must-revalidate
          content:
            application/json:
              schema:
                type: object
                properties:
                  lang:
                    type: string
                    minLength: 2
                    maxLength: 35
                  dir:
                    type: string
                    enum: *a4
                  contentVersion:
                    type: string
                    minLength: 1
                    maxLength: 256
                  reviewedOn:
                    type:
                      - string
                      - "null"
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 128
                        question:
                          type: string
                          minLength: 1
                          maxLength: 1000
                        answer:
                          type: string
                          minLength: 1
                          maxLength: 4000
                        citations:
                          type: array
                          items:
                            type: object
                            properties:
                              passageId:
                                type: string
                                minLength: 1
                                maxLength: 256
                              label:
                                type: string
                                minLength: 1
                                maxLength: 1000
                              url:
                                type: string
                                maxLength: 4000
                                format: uri
                                pattern: ^https?:\/\/
                              sourceLang:
                                type: string
                                minLength: 1
                                maxLength: 35
                              sourceType:
                                type: string
                                enum:
                                  - course
                              timestamp:
                                type: number
                            required:
                              - passageId
                              - label
                              - url
                              - sourceLang
                              - sourceType
                            additionalProperties: false
                          minItems: 1
                          maxItems: 1
                      required:
                        - id
                        - question
                        - answer
                        - citations
                      additionalProperties: false
                    maxItems: 100
                required:
                  - lang
                  - dir
                  - contentVersion
                  - reviewedOn
                  - items
                additionalProperties: false
        "304":
          description: Not modified; reuse the previously reviewed representation
        "400":
          description: Problem response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
        "404":
          description: Problem response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
  /v1/sessions:
    post:
      summary: Create or resume a learner session
      security:
        - hostKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lang:
                  type: string
                  minLength: 2
                  maxLength: 8
                channel:
                  type: string
                  enum: *a5
                  default: web
                sessionId:
                  type: string
                  minLength: 8
                  maxLength: 64
                resumeToken:
                  type: string
                  minLength: 20
                  maxLength: 100
                cloudOk:
                  type: boolean
                consentVersion:
                  type: string
                  minLength: 1
                  maxLength: 64
              additionalProperties: false
      responses:
        "200":
          description: Resumed session
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  sessionToken:
                    type: string
                  resumeToken:
                    type: string
                  lang:
                    type: string
                  cloudOk:
                    type: boolean
                  consentVersion:
                    type:
                      - string
                      - "null"
                required:
                  - sessionId
                  - sessionToken
                  - resumeToken
                  - lang
                  - cloudOk
                  - consentVersion
                additionalProperties: false
        "201":
          description: Created session
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  sessionToken:
                    type: string
                  resumeToken:
                    type: string
                  lang:
                    type: string
                  cloudOk:
                    type: boolean
                  consentVersion:
                    type:
                      - string
                      - "null"
                required:
                  - sessionId
                  - sessionToken
                  - resumeToken
                  - lang
                  - cloudOk
                  - consentVersion
                additionalProperties: false
        "400":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
        "401":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
        "403":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
  /v1/ask:
    post:
      summary: Ask a question
      security:
        - sessionBearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  minLength: 8
                  maxLength: 64
                clientMsgId:
                  type: string
                  minLength: 8
                  maxLength: 64
                lang:
                  type: string
                  minLength: 2
                  maxLength: 8
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: At most 1000 Unicode code points
                via:
                  type: string
                  enum: *a6
                simple:
                  type: boolean
                  default: false
              required:
                - sessionId
                - clientMsgId
                - lang
                - text
                - via
              additionalProperties: false
      responses:
        "200":
          description: Structured reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  kind:
                    type: string
                    enum: *a7
                  text:
                    type: string
                  lang:
                    type: string
                  dir:
                    type: string
                    enum: *a8
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        passageId:
                          type: string
                        label:
                          type: string
                        url:
                          type: string
                          format: uri
                        sourceLang:
                          type: string
                        sourceType:
                          type: string
                          enum: *a9
                        timestamp:
                          type: number
                      required:
                        - passageId
                        - label
                        - url
                        - sourceLang
                        - sourceType
                      additionalProperties: false
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: *a10
                        label:
                          type: string
                      required:
                        - type
                        - label
                      additionalProperties: false
                  audioUrl:
                    type: string
                    format: uri
                  contentVersion:
                    type: string
                required:
                  - id
                  - kind
                  - text
                  - lang
                  - dir
                  - citations
                  - actions
                  - contentVersion
                additionalProperties: false
        "400":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
        "401":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
        "409":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
        "413":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
        "429":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
  /v1/feedback:
    post:
      summary: Record anonymous helpfulness and bounded session streak
      description: Only replyId/helpful are accepted. The bearer must belong to the
        reply's current session. No per-tap event or session identifier is
        retained in aggregates.
      security:
        - sessionBearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                replyId:
                  type: string
                  minLength: 1
                  maxLength: 128
                helpful:
                  type: boolean
              required:
                - replyId
                - helpful
              additionalProperties: false
      responses:
        "200":
          description: Counter recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a3
