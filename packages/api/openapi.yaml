  /v1/locales/{code}/faq:
    get:
      summary: Get reviewed, actively cited offline FAQ content
      description: Draft or unreviewed packs return an empty list. Preview never
        authorizes draft answers. Unresolved or ambiguous source references are
        omitted. No identity or session is required.
      parameters:
        - schema:
            type: string
          required: true
          name: code
          in: path
        - schema:
            type: string
            enum:
              - "0"
              - "1"
          required: false
          name: lang_preview
          in: query
        - schema:
            type: string
          required: false
          name: if-none-match
          in: header
      responses:
        "200":
          description: Reviewed FAQ with canonical active passage citations, or an honest
            empty list
          headers:
            ETag:
              description: Validator for the complete representation including content version
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: public, max-age=0, must-revalidate
          content:
            application/json:
              schema:
                type: object
                properties:
                  lang:
                    type: string
                    minLength: 2
                    maxLength: 35
                  dir:
                    type: string
                    enum: *a8
                  contentVersion:
                    type: string
                    minLength: 1
                    maxLength: 256
                  reviewedOn:
                    type:
                      - string
                      - "null"
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 128
                        question:
                          type: string
                          minLength: 1
                          maxLength: 1000
                        answer:
                          type: string
                          minLength: 1
                          maxLength: 4000
                        citations:
                          type: array
                          items:
                            type: object
                            properties:
                              passageId:
                                type: string
                                minLength: 1
                                maxLength: 256
                              label:
                                type: string
                                minLength: 1
                                maxLength: 1000
                              url:
                                type: string
                                maxLength: 4000
                                format: uri
                                pattern: ^https?:\/\/
                              sourceLang:
                                type: string
                                minLength: 1
                                maxLength: 35
                              sourceType:
                                type: string
                                enum:
                                  - course
                              timestamp:
                                type: number
                            required:
                              - passageId
                              - label
                              - url
                              - sourceLang
                              - sourceType
                            additionalProperties: false
                          minItems: 1
                          maxItems: 1
                      required:
                        - id
                        - question
                        - answer
                        - citations
                      additionalProperties: false
                    maxItems: 100
                required:
                  - lang
                  - dir
                  - contentVersion
                  - reviewedOn
                  - items
                additionalProperties: false
        "304":
          description: Not modified; reuse the previously reviewed representation
        "400":
          description: Problem response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
