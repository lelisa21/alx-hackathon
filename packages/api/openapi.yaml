                      minLength: 8
                      maxLength: 128
                    id:
                      type: string
                      minLength: 8
                      maxLength: 128
                    revision:
                      type: integer
                      exclusiveMinimum: 0
                  required:
                    - action
                    - sessionId
                    - id
                    - revision
                  additionalProperties: false
                - type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - send
                    sessionId:
                      type: string
                      minLength: 8
                      maxLength: 128
                    id:
                      type: string
                      minLength: 8
                      maxLength: 128
                    revision:
                      type: integer
                      exclusiveMinimum: 0
                  required:
                    - action
                    - sessionId
                    - id
                    - revision
                  additionalProperties: false
      responses:
        "200":
          description: Exact private request for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  revision:
                    type: integer
                    exclusiveMinimum: 0
                  status:
                    type: string
                    enum: *a16
                  sendAttempted:
                    type: boolean
                  message:
                    type: string
                  jobId:
                    type: string
                  lang:
                    type: string
                    minLength: 2
                    maxLength: 35
                  needs:
                    type: array
                    items:
                      type: string
                      enum: *a1
                    minItems: 0
                    maxItems: 6
                  otherText:
                    type: string
                  name:
