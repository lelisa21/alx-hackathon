  /v1/sms/inbound:
    post:
      summary: Accept an authenticated SMS gateway or simulator inbound message
      description: The simulator uses this same service path. IDs are stable per
        pseudonymous phone identity; retries preserve the exact body, while
        changed payloads conflict. First contact returns a numeric language
        menu. STOP bypasses conversation burst/daily limits, confirms once and
        remains permanent. Responses are no-store; the gateway secret and phone
        number are never returned. At most 1000 Unicode code points are
        accepted. Per-phone burst limit is 30 new messages/minute and outbound
        limit defaults to 20/day; repeated inbound IDs do not repeat side
        effects.
      security:
        - smsGatewayBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$/u
                from:
                  type: string
                  pattern: ^\+[1-9]\d{6,14}$/u
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Nonempty SMS text, at most 1000 Unicode code points
              required:
                - id
                - from
                - text
              additionalProperties: false
      responses:
        "200":
          description: Delivered or pending SMS messages, permanent STOP state and
            persisted conversation language
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 256
                        text:
                          type: string
                          minLength: 1
                          maxLength: 2000
                        encoding:
                          type: string
                          enum:
                            - gsm7
                            - ucs2
                        units:
                          type: integer
                          minimum: 0
                        segments:
                          type: integer
                          minimum: 1
                          maximum: 3
                        status:
                          type: string
                          enum:
                            - queued
                            - sent
                            - delivered
                            - failed
                      required:
                        - id
                        - text
                        - encoding
                        - units
                        - segments
                        - status
                      additionalProperties: false
                    maxItems: 10
                  stopped:
                    type: boolean
                  lang:
                    type: string
                    minLength: 2
                    maxLength: 35
                required:
                  - messages
                  - stopped
                  - lang
                additionalProperties: false
        "400":
          description: Localized SMS problem without contact or input text
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum:
                      - invalid_request
                      - unauthorized
                      - forbidden
                      - not_found
                      - conflict
                      - rate_limited
                      - payload_too_large
                      - internal
                  messageKey:
                    type: string
                  lang:
                    type: string
                    minLength: 2
                    maxLength: 35
                  message:
                    type: string
                required:
                  - type
