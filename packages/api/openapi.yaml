openapi: 3.1.0
info:
  title: Dimts API
  version: 0.1.0
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
    helperBearer:
      type: http
      scheme: bearer
    hostKey:
      type: apiKey
      in: header
      name: X-Dimts-Key
    cronBearer:
      type: http
      scheme: bearer
  schemas:
    AskRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
        clientMsgId:
          type: string
          minLength: 8
          maxLength: 64
        lang:
          type: string
          minLength: 2
          maxLength: 8
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: At most 1000 Unicode code points
        via:
          type: string
          enum: &a7
            - text
            - voice
            - sms
            - telegram
        simple:
          type: boolean
          default: false
      required:
        - sessionId
        - clientMsgId
        - lang
        - text
        - via
      additionalProperties: false
    FeedbackRequest:
      type: object
      properties:
        replyId:
          type: string
          minLength: 1
          maxLength: 128
        helpful:
          type: boolean
      required:
        - replyId
        - helpful
      additionalProperties: false
    FeedbackResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    Reply:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: &a8
            - answer
            - notfound
            - escalation
            - distress
            - system
        text:
          type: string
        lang:
          type: string
        dir:
          type: string
          enum: &a9
            - ltr
            - rtl
        citations:
          type: array
          items:
            type: object
            properties:
              passageId:
                type: string
              label:
                type: string
              url:
                type: string
                format: uri
              sourceLang:
                type: string
              sourceType:
                type: string
                enum: &a10
                  - course
                  - job
              timestamp:
                type: number
            required:
              - passageId
              - label
              - url
              - sourceLang
              - sourceType
            additionalProperties: false
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: &a11
                  - help
                  - more
                  - open_source
                  - subscribe_jobs
                  - language
                  - retry
              label:
                type: string
            required:
              - type
              - label
            additionalProperties: false
        audioUrl:
          type: string
          format: uri
        contentVersion:
          type: string
      required:
        - id
        - kind
        - text
        - lang
        - dir
        - citations
        - actions
        - contentVersion
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: number
        code:
          type: string
          enum: &a2
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - payload_too_large
            - internal
        messageKey:
          type: string
      required:
        - type
        - title
        - status
        - code
        - messageKey
      additionalProperties: false
    SessionRequest:
      type: object
      properties:
        lang:
          type: string
          minLength: 2
          maxLength: 8
        channel:
          type: string
          enum: &a6
            - web
            - api
          default: web
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
        resumeToken:
          type: string
          minLength: 20
          maxLength: 100
        cloudOk:
          type: boolean
        consentVersion:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    SessionResponse:
      type: object
      properties:
        sessionId:
          type: string
        sessionToken:
          type: string
        resumeToken:
          type: string
        lang:
          type: string
        cloudOk:
          type: boolean
        consentVersion:
          type:
            - string
            - "null"
      required:
        - sessionId
        - sessionToken
        - resumeToken
        - lang
        - cloudOk
        - consentVersion
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        db:
          type: boolean
        version:
          type: string
        contentVersion:
          type: string
        provider:
          type: string
        ladder:
          type: array
          items:
            type: string
      required:
        - ok
        - db
        - version
        - contentVersion
        - provider
        - ladder
      additionalProperties: false
    HelperLoginRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
      required:
        - token
      additionalProperties: false
    HelperLoginResponse:
      type: object
      properties:
        jwt:
          type: string
      required:
        - jwt
      additionalProperties: false
    HelpCreateRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
        includeSummary:
          type: boolean
      required:
        - sessionId
        - includeSummary
      additionalProperties: false
    HelpCreateResponse:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum:
            - waiting
      required:
        - id
        - status
      additionalProperties: false
    HelpQueueResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              lang:
                type: string
                minLength: 2
                maxLength: 35
              channel:
                type: string
                enum: &a12
                  - web
                  - api
              createdAt:
                type: string
                format: date-time
              summary:
                type:
                  - array
                  - "null"
                items:
                  type: string
                  maxLength: 2000
                maxItems: 3
            required:
              - id
              - lang
              - channel
              - createdAt
              - summary
            additionalProperties: false
      required:
        - requests
      additionalProperties: false
    HelpBlockResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    HelpClaimResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    HelpAvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
        nextOpenAt:
          type: string
          format: date-time
        waitTimeoutMs:
          type: integer
          exclusiveMinimum: 0
      required:
        - available
        - waitTimeoutMs
      additionalProperties: false
    HelperProfile:
      type: object
      properties:
        displayName:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 40
      required:
        - displayName
      additionalProperties: false
    HelpMetrics:
      type: object
      properties:
        closedCount:
          type: integer
          minimum: 0
        resolvedCount:
          type: integer
          minimum: 0
        unresolvedCount:
          type: integer
          minimum: 0
        totalWaitMs:
          type: number
          minimum: 0
        totalResolutionMs:
          type: number
          minimum: 0
      required:
        - closedCount
        - resolvedCount
        - unresolvedCount
        - totalWaitMs
        - totalResolutionMs
      additionalProperties: false
    HelpIceResponse:
      type: object
      properties:
        iceServers:
          type: array
          items:
            type: object
            properties:
              urls:
                anyOf:
                  - type: string
                    pattern: ^(?:stun|stuns|turn|turns):[^\s]{1,500}$
                  - type: array
                    items:
                      type: string
                      pattern: ^(?:stun|stuns|turn|turns):[^\s]{1,500}$
                    minItems: 1
                    maxItems: 16
              username:
                type: string
                maxLength: 1024
              credential:
                type: string
                maxLength: 1024
            required:
              - urls
            additionalProperties: false
          minItems: 1
          maxItems: 16
        expiresAt:
          type: string
          format: date-time
      required:
        - iceServers
      additionalProperties: false
    HelpImage:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
      required:
        - id
        - expiresAt
      additionalProperties: false
    HelpImageList:
      type: object
      properties:
        images:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              expiresAt:
                type: string
                format: date-time
            required:
              - id
              - expiresAt
            additionalProperties: false
      required:
        - images
      additionalProperties: false
    LanguageList:
      type: object
      properties:
        languages:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              nameNative:
                type: string
              nameEn:
                type: string
              script:
                type: string
              dir:
                type: string
                enum: &a3
                  - ltr
                  - rtl
              status:
                type: string
                enum: &a4
                  - live
                  - beta
                  - draft
              stt:
                type: boolean
              tts:
                type: boolean
              voice:
                type:
                  - object
                  - "null"
                properties:
                  engine:
                    type: string
                    enum:
                      - browser
                  bcp_tag:
                    type: string
                    minLength: 2
                    maxLength: 35
                required:
                  - engine
                  - bcp_tag
                additionalProperties: false
                description: Reviewed browser declaration when at least one voice direction is
                  enabled; otherwise null. The BCP 47 tag must match the pack
                  language and script.
            required:
              - code
              - nameNative
              - nameEn
              - script
              - dir
              - status
              - stt
              - tts
              - voice
            additionalProperties: false
      required:
        - languages
      additionalProperties: false
    LocaleUI:
      type: object
      additionalProperties:
        type: string
    LocaleFAQ:
      type: object
      properties:
        lang:
          type: string
          minLength: 2
          maxLength: 35
        dir:
          type: string
          enum: &a5
            - ltr
            - rtl
        contentVersion:
          type: string
          minLength: 1
          maxLength: 256
        reviewedOn:
          type:
            - string
            - "null"
          pattern: ^\d{4}-\d{2}-\d{2}$
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              question:
                type: string
                minLength: 1
                maxLength: 1000
              answer:
                type: string
                minLength: 1
                maxLength: 4000
              citations:
                type: array
                items:
                  type: object
                  properties:
                    passageId:
                      type: string
                      minLength: 1
                      maxLength: 256
                    label:
                      type: string
                      minLength: 1
                      maxLength: 1000
                    url:
                      type: string
                      maxLength: 4000
                      format: uri
                      pattern: ^https?:\/\/
                    sourceLang:
                      type: string
                      minLength: 1
                      maxLength: 35
                    sourceType:
                      type: string
                      enum:
                        - course
                    timestamp:
                      type: number
                  required:
                    - passageId
                    - label
                    - url
                    - sourceLang
                    - sourceType
                  additionalProperties: false
                minItems: 1
                maxItems: 1
            required:
              - id
              - question
              - answer
              - citations
            additionalProperties: false
          maxItems: 100
      required:
        - lang
        - dir
        - contentVersion
        - reviewedOn
        - items
      additionalProperties: false
    JobImportRequest:
      type: object
      properties:
        lang:
          type: string
          minLength: 2
          maxLength: 35
        postings: {}
      required:
        - lang
        - postings
      additionalProperties: false
    JobImportResponse:
      type: object
      properties:
        imported:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
              reason:
                type: string
            required:
              - index
              - reason
            additionalProperties: false
      required:
        - imported
        - errors
      additionalProperties: false
    Jobs:
      type: object
      properties:
        jobs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              description:
                type: string
              organization:
                type: string
              location:
                type: string
              region:
                type:
                  - string
                  - "null"
              jobType:
                type:
                  - string
                  - "null"
              datePosted:
                type: string
              deadline:
                type:
                  - string
                  - "null"
              deadlineDisplay:
                type:
                  - string
                  - "null"
              url:
                type: string
                format: uri
              lang:
                type: string
                minLength: 2
                maxLength: 35
              accommodationsOffered:
                type: array
                items:
                  type: string
            required:
              - id
              - title
              - description
              - organization
              - location
              - region
              - jobType
              - datePosted
              - deadline
              - deadlineDisplay
              - url
              - lang
              - accommodationsOffered
            additionalProperties: false
        channels:
          type: array
          items:
            type: string
            enum: &a13
              - sms
              - telegram
        relayAvailable:
          type: boolean
        glossary:
          type: array
          items:
            type: object
            properties:
              term:
                type: string
              meaning:
                type: string
            required:
              - term
              - meaning
            additionalProperties: false
      required:
        - jobs
        - channels
        - relayAvailable
        - glossary
      additionalProperties: false
    SubscriptionRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 128
        clientRequestId:
          type: string
          minLength: 8
          maxLength: 128
        jobType:
          type: string
          minLength: 1
          maxLength: 120
        region:
          type: string
          minLength: 1
          maxLength: 120
        lang:
          type: string
          minLength: 2
          maxLength: 35
        channel:
          type: string
          enum: &a15
            - sms
            - telegram
        contact:
          type: string
          minLength: 1
          maxLength: 128
        consent:
          type: object
          properties:
            accepted:
              type: boolean
              enum:
                - true
            noticeVersion:
              type: string
              enum:
                - job-alerts-v1
          required:
            - accepted
            - noticeVersion
          additionalProperties: false
      required:
        - sessionId
        - clientRequestId
        - lang
        - channel
        - contact
        - consent
      additionalProperties: false
    Subscription:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: &a14
            - active
            - stopped
      required:
        - id
        - status
      additionalProperties: false
    AccommodationRequest:
      oneOf:
        - type: object
          properties:
            action:
              type: string
              enum:
                - draft
            sessionId:
              type: string
              minLength: 8
              maxLength: 128
            clientRequestId:
              type: string
              minLength: 8
              maxLength: 128
            jobId:
              type: string
              minLength: 1
              maxLength: 128
            lang:
              type: string
              minLength: 2
              maxLength: 35
            needs:
              type: array
              items:
                type: string
                enum: &a1
                  - sign_language_interpreter
                  - step_free_access
                  - written_questions
                  - extra_time
                  - screen_reader_friendly_test
                  - other
              minItems: 1
              maxItems: 6
            otherText:
              type: string
              minLength: 1
              maxLength: 1000
            name:
              type: string
              minLength: 1
              maxLength: 80
            interviewAt:
              type: string
              format: date-time
          required:
            - action
            - sessionId
            - clientRequestId
            - jobId
            - lang
            - needs
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              enum:
                - resume
            sessionId:
              type: string
              minLength: 8
              maxLength: 128
            id:
              type: string
              minLength: 8
              maxLength: 128
          required:
            - action
            - sessionId
            - id
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              enum:
                - cancel
            sessionId:
              type: string
              minLength: 8
              maxLength: 128
            id:
              type: string
              minLength: 8
              maxLength: 128
          required:
            - action
            - sessionId
            - id
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              enum:
                - approve
            sessionId:
              type: string
              minLength: 8
              maxLength: 128
            id:
              type: string
              minLength: 8
              maxLength: 128
            revision:
              type: integer
              exclusiveMinimum: 0
          required:
            - action
            - sessionId
            - id
            - revision
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              enum:
                - send
            sessionId:
              type: string
              minLength: 8
              maxLength: 128
            id:
              type: string
              minLength: 8
              maxLength: 128
            revision:
              type: integer
              exclusiveMinimum: 0
          required:
            - action
            - sessionId
            - id
            - revision
          additionalProperties: false
    Accommodation:
      type: object
      properties:
        id:
          type: string
        revision:
          type: integer
          exclusiveMinimum: 0
        status:
          type: string
          enum: &a16
            - draft
            - approved
            - sent
            - cancelled
        sendAttempted:
          type: boolean
        message:
          type: string
        jobId:
          type: string
        lang:
          type: string
          minLength: 2
          maxLength: 35
        needs:
          type: array
          items:
            type: string
            enum: *a1
          minItems: 0
          maxItems: 6
        otherText:
          type: string
        name:
          type: string
        interviewAt:
          type: string
        interviewDisplay:
          type: string
      required:
        - id
        - revision
        - status
        - sendAttempted
        - message
        - jobId
        - lang
        - needs
      additionalProperties: false
  parameters: {}
paths:
  /v1/help/availability:
    get:
      summary: Get scheduled helper availability and calm waiting threshold
      security:
        - sessionBearer: []
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 64
          required: true
          name: sessionId
          in: query
      responses:
        "200":
          description: UTC schedule, not live helper presence
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  nextOpenAt:
                    type: string
                    format: date-time
                  waitTimeoutMs:
                    type: integer
                    exclusiveMinimum: 0
                required:
                  - available
                  - waitTimeoutMs
                additionalProperties: false
        "400":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a2
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
        "401":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a2
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
  /v1/helpers/profile:
    get:
      summary: Read or deliberately change the optional public helper first name
      security:
        - helperBearer: []
      responses:
        "200":
          description: Null disables public name
          content:
            application/json:
              schema:
                type: object
                properties:
                  displayName:
                    type:
                      - string
                      - "null"
                    minLength: 1
                    maxLength: 40
                required:
                  - displayName
                additionalProperties: false
        "400":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a2
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
        "401":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a2
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
    patch:
      summary: Read or deliberately change the optional public helper first name
      security:
        - helperBearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type:
                    - string
                    - "null"
                  minLength: 1
                  maxLength: 40
              required:
                - displayName
              additionalProperties: false
      responses:
        "200":
          description: Null disables public name
          content:
            application/json:
              schema:
                type: object
                properties:
                  displayName:
                    type:
                      - string
                      - "null"
                    minLength: 1
                    maxLength: 40
                required:
                  - displayName
                additionalProperties: false
        "400":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a2
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
        "401":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
                    enum: *a2
                  messageKey:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - messageKey
                additionalProperties: false
  /v1/help/metrics:
    get:
      summary: Anonymous service totals without content or identifiers
      description: closedCount includes unclassified outcomes. Only explicit helper
        resolved true/false increments resolvedCount/unresolvedCount. Wait and
        resolution totals include only claimed requests that have closed; units
        are milliseconds. No per-session or helper breakdown is stored.
      security:
        - helperBearer: []
      responses:
        "200":
          description: Aggregate counts and duration totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  closedCount:
                    type: integer
                    minimum: 0
                  resolvedCount:
                    type: integer
                    minimum: 0
                  unresolvedCount:
                    type: integer
                    minimum: 0
                  totalWaitMs:
                    type: number
                    minimum: 0
                  totalResolutionMs:
                    type: number
                    minimum: 0
                required:
                  - closedCount
                  - resolvedCount
                  - unresolvedCount
                  - totalWaitMs
                  - totalResolutionMs
                additionalProperties: false
        "401":
          description: Problem response
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  code:
                    type: string
