              type: object
              properties:
                id:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                type:
                  type: string
                  enum: &a1
                    - private
                    - group
                    - supergroup
                    - channel
                first_name:
                  type: string
                  maxLength: 256
                last_name:
                  type: string
                  maxLength: 256
                username:
                  type: string
                  maxLength: 64
                title:
                  type: string
                  maxLength: 256
                is_forum:
                  type: boolean
                is_direct_messages:
                  type: boolean
              required:
                - id
                - type
              additionalProperties: false
            from:
              type: object
              properties:
                id:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                  exclusiveMinimum: 0
                is_bot:
