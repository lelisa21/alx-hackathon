    post:
      summary: Draft, resume, approve, send or cancel a private interview support
        request
      description: Only draft accepts needs, optional name and interview time. Draft
        edits create a new revision; approval freezes the exact message. Approve
        and send require the exact current revision; send requires explicit
        prior approval. sendAttempted is durable before external delivery, and
        blocks editing or cancellation of an uncertain send. Target comes only
        from the posting's hiringOrganization.contactPoint.email. Retry uses the
        same durable idempotency key. Responses are no-store; no diagnosis or
        proof fields are accepted.
      security:
        - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - draft
                    sessionId:
                      type: string
                      minLength: 8
                      maxLength: 128
                    clientRequestId:
                      type: string
                      minLength: 8
                      maxLength: 128
                    jobId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    lang:
                      type: string
                      minLength: 2
                      maxLength: 35
                    needs:
                      type: array
                      items:
                        type: string
                        enum:
                          - sign_language_interpreter
