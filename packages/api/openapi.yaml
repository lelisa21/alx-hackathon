                          type: string
                          minLength: 1
                          maxLength: 2000
                        encoding:
                          type: string
                          enum: *a3
                        units:
                          type: integer
                          minimum: 0
                        segments:
                          type: integer
                          minimum: 1
                          maximum: 3
                        status:
                          type: string
                          enum: *a4
                      required:
                        - id
                        - text
                        - encoding
                        - units
                        - segments
                        - status
                      additionalProperties: false
                    maxItems: 10
                  stopped:
                    type: boolean
                  lang:
                    type: string
                    minLength: 2
                    maxLength: 35
