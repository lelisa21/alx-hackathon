openapi: 3.1.0
info:
  title: Dimts API
  version: 0.1.0
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
    helperBearer:
      type: http
      scheme: bearer
    hostKey:
      type: apiKey
      in: header
      name: X-Dimts-Key
    cronBearer:
      type: http
      scheme: bearer
    smsGatewayBearer:
      type: http
      scheme: bearer
      description: Separately configured DIMTS_SMS_GATEWAY_SECRET; never a session,
        host or cron credential
    telegramWebhookSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Separately configured DIMTS_TELEGRAM_SECRET; hosted webhook mode only
  schemas:
    AskRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
        clientMsgId:
          type: string
          minLength: 8
          maxLength: 64
        lang:
          type: string
          minLength: 2
          maxLength: 8
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: At most 1000 Unicode code points
        via:
          type: string
          enum: &a10
            - text
            - voice
            - sms
            - telegram
        simple:
          type: boolean
          default: false
      required:
        - sessionId
        - clientMsgId
        - lang
        - text
        - via
      additionalProperties: false
    FeedbackRequest:
      type: object
      properties:
        replyId:
          type: string
          minLength: 1
          maxLength: 128
        helpful:
          type: boolean
      required:
        - replyId
        - helpful
      additionalProperties: false
    FeedbackResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    Reply:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: &a11
            - answer
            - notfound
            - escalation
            - distress
            - system
        text:
          type: string
        lang:
          type: string
        dir:
          type: string
          enum: &a12
            - ltr
            - rtl
        citations:
          type: array
          items:
            type: object
            properties:
              passageId:
                type: string
              label:
                type: string
              url:
                type: string
                format: uri
              sourceLang:
                type: string
              sourceType:
                type: string
                enum: &a13
                  - course
                  - job
              timestamp:
                type: number
            required:
              - passageId
              - label
              - url
              - sourceLang
              - sourceType
            additionalProperties: false
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: &a14
                  - help
                  - more
                  - open_source
                  - subscribe_jobs
                  - language
                  - retry
              label:
                type: string
            required:
              - type
              - label
            additionalProperties: false
        audioUrl:
          type: string
          format: uri
        contentVersion:
          type: string
      required:
        - id
        - kind
        - text
        - lang
        - dir
        - citations
        - actions
        - contentVersion
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: number
        code:
          type: string
          enum: &a2
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - payload_too_large
            - internal
        messageKey:
          type: string
      required:
        - type
        - title
        - status
        - code
        - messageKey
      additionalProperties: false
    TelegramUpdate:
      type: object
      properties:
        update_id:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        message:
          type: object
          properties:
            message_id:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
              exclusiveMinimum: 0
            date:
              type: integer
              minimum: 0
              maximum: 9007199254740991
