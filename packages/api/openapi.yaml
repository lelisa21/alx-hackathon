  /v1/languages:
    get:
      summary: List available language packs
      description: Voice flags intersect configured browser engines with reviewed,
        non-draft pack approvals and a matching BCP 47 declaration. Preview
        never enables draft voice. Browser capabilities may further disable a
        direction.
      parameters:
        - schema:
            type: string
            enum:
              - "0"
              - "1"
          required: false
          name: lang_preview
          in: query
      responses:
        "200":
          description: Available languages
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        nameNative:
                          type: string
                        nameEn:
                          type: string
                        script:
                          type: string
                        dir:
                          type: string
                          enum:
                            - ltr
                            - rtl
                        status:
                          type: string
                          enum:
                            - live
                            - beta
                            - draft
                        stt:
                          type: boolean
                        tts:
                          type: boolean
                        voice:
                          type:
                            - object
                            - "null"
                          properties:
                            engine:
                              type: string
                              enum:
                                - browser
                            bcp_tag:
                              type: string
                              minLength: 2
                              maxLength: 35
                          required:
                            - engine
                            - bcp_tag
                          additionalProperties: false
                          description: Reviewed browser declaration when at least one voice direction is
                            enabled; otherwise null. The BCP 47 tag must match
                            the pack language and script.
                      required:
                        - code
                        - nameNative
                        - nameEn
                        - script
                        - dir
                        - status
                        - stt
                        - tts
                        - voice
