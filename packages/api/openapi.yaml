openapi: 3.1.0
info:
  title: Dimts API
  version: 0.1.0
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
    helperBearer:
      type: http
      scheme: bearer
    hostKey:
      type: apiKey
      in: header
      name: X-Dimts-Key
    cronBearer:
      type: http
      scheme: bearer
    smsGatewayBearer:
      type: http
      scheme: bearer
      description: Separately configured DIMTS_SMS_GATEWAY_SECRET; never a session,
        host or cron credential
    telegramWebhookSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Separately configured DIMTS_TELEGRAM_SECRET; hosted webhook mode only
    ltiBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed LTI id_token from authorized platform
  schemas:
    AskRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
        clientMsgId:
          type: string
          minLength: 8
          maxLength: 64
        lang:
          type: string
          minLength: 2
          maxLength: 8
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: At most 1000 Unicode code points
        via:
          type: string
          enum:
            - text
            - voice
            - sms
            - telegram
        simple:
          type: boolean
          default: false
      required:
        - sessionId
        - clientMsgId
        - lang
        - text
        - via
      additionalProperties: false
    DataDeleteRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
      required:
        - sessionId
      additionalProperties: false
    FeedbackRequest:
      type: object
      properties:
        replyId:
          type: string
          minLength: 1
          maxLength: 128
        helpful:
          type: boolean
      required:
        - replyId
        - helpful
      additionalProperties: false
    FeedbackResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    Reply:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - answer
            - notfound
            - escalation
            - distress
            - system
        text:
          type: string
        lang:
          type: string
        dir:
          type: string
          enum:
            - ltr
            - rtl
        citations:
          type: array
          items:
            type: object
            properties:
              passageId:
                type: string
              label:
                type: string
              url:
                type: string
                format: uri
              sourceLang:
                type: string
              sourceType:
                type: string
                enum:
                  - course
                  - job
              timestamp:
                type: number
            required:
              - passageId
              - label
              - url
              - sourceLang
              - sourceType
            additionalProperties: false
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - help
                  - more
                  - open_source
                  - subscribe_jobs
                  - language
                  - retry
              label:
                type: string
            required:
              - type
              - label
            additionalProperties: false
        audioUrl:
          type: string
          format: uri
        contentVersion:
          type: string
      required:
        - id
        - kind
        - text
        - lang
        - dir
        - citations
        - actions
        - contentVersion
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: number
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - payload_too_large
            - internal
        messageKey:
          type: string
      required:
        - type
        - title
        - status
        - code
        - messageKey
      additionalProperties: false
    TelegramAck:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    TelegramProblem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: number
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - payload_too_large
            - internal
        messageKey:
          type: string
        lang:
          type: string
        message:
          type: string
      required:
        - type
        - title
        - status
        - code
        - messageKey
        - lang
        - message
      additionalProperties: false
    SmsInboundRequest:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$/u
        from:
          type: string
          pattern: ^\+[1-9]\d{6,14}$/u
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Nonempty SMS text, at most 1000 Unicode code points
      required:
        - id
        - from
        - text
      additionalProperties: false
    SmsMessage:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        text:
          type: string
          minLength: 1
          maxLength: 2000
        encoding:
          type: string
          enum:
            - gsm7
            - ucs2
        units:
          type: integer
          minimum: 0
        segments:
          type: integer
          minimum: 1
          maximum: 3
        status:
          type: string
          enum:
            - queued
            - sent
            - delivered
            - failed
      required:
        - id
        - text
        - encoding
        - units
        - segments
        - status
      additionalProperties: false
    SmsInboundResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 256
              text:
                type: string
                minLength: 1
                maxLength: 2000
              encoding:
                type: string
                enum:
                  - gsm7
                  - ucs2
              units:
                type: integer
                minimum: 0
              segments:
                type: integer
                minimum: 1
                maximum: 3
              status:
                type: string
                enum:
                  - queued
                  - sent
                  - delivered
                  - failed
            required:
              - id
              - text
              - encoding
              - units
              - segments
              - status
            additionalProperties: false
          maxItems: 10
        stopped:
          type: boolean
        lang:
          type: string
          minLength: 2
          maxLength: 35
      required:
        - messages
        - stopped
        - lang
      additionalProperties: false
    SmsProblem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: number
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - payload_too_large
            - internal
        messageKey:
          type: string
        lang:
          type: string
          minLength: 2
          maxLength: 35
        message:
          type: string
      required:
        - type
        - title
        - status
        - code
        - messageKey
        - lang
        - message
      additionalProperties: false
    SessionRequest:
      type: object
      properties:
        lang:
          type: string
          minLength: 2
          maxLength: 8
        channel:
          type: string
          enum:
            - web
            - api
          default: web
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
        resumeToken:
          type: string
          minLength: 20
          maxLength: 100
        cloudOk:
          type: boolean
        consentVersion:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    SessionResponse:
      type: object
      properties:
        sessionId:
          type: string
        sessionToken:
          type: string
        resumeToken:
          type: string
        lang:
          type: string
        cloudOk:
          type: boolean
        consentVersion:
          type:
            - string
            - "null"
      required:
        - sessionId
        - sessionToken
        - resumeToken
        - lang
        - cloudOk
        - consentVersion
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        db:
          type: boolean
        version:
          type: string
        contentVersion:
          type: string
        provider:
          type: string
        ladder:
          type: array
          items:
            type: string
      required:
        - ok
        - db
        - version
        - contentVersion
        - provider
        - ladder
      additionalProperties: false
    HelperLoginRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
      required:
        - token
      additionalProperties: false
    HelperLoginResponse:
      type: object
      properties:
        jwt:
          type: string
      required:
        - jwt
      additionalProperties: false
    HelpCreateRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 64
        includeSummary:
          type: boolean
      required:
        - sessionId
        - includeSummary
      additionalProperties: false
    HelpCreateResponse:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum:
            - waiting
      required:
        - id
        - status
      additionalProperties: false
    HelpQueueResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              lang:
                type: string
                minLength: 2
                maxLength: 35
              channel:
                type: string
                enum:
                  - web
                  - api
                  - telegram
              createdAt:
                type: string
                format: date-time
              summary:
                type:
                  - array
                  - "null"
                items:
                  type: string
                  maxLength: 2000
                maxItems: 3
            required:
              - id
              - lang
              - channel
              - createdAt
              - summary
            additionalProperties: false
      required:
        - requests
      additionalProperties: false
    HelpBlockResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    HelpClaimResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: false
    HelpAvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
        nextOpenAt:
          type: string
          format: date-time
        waitTimeoutMs:
          type: integer
          exclusiveMinimum: 0
      required:
        - available
        - waitTimeoutMs
      additionalProperties: false
    HelperProfile:
      type: object
      properties:
        displayName:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 40
      required:
        - displayName
      additionalProperties: false
    HelpMetrics:
      type: object
      properties:
        closedCount:
          type: integer
          minimum: 0
        resolvedCount:
          type: integer
          minimum: 0
        unresolvedCount:
          type: integer
          minimum: 0
        totalWaitMs:
          type: number
          minimum: 0
        totalResolutionMs:
          type: number
          minimum: 0
      required:
        - closedCount
        - resolvedCount
        - unresolvedCount
        - totalWaitMs
        - totalResolutionMs
      additionalProperties: false
    HelpIceResponse:
      type: object
      properties:
        iceServers:
          type: array
          items:
            type: object
            properties:
              urls:
                anyOf:
                  - type: string
                    pattern: ^(?:stun|stuns|turn|turns):[^\s]{1,500}$/u
                  - type: array
                    items:
                      type: string
                      pattern: ^(?:stun|stuns|turn|turns):[^\s]{1,500}$/u
                    minItems: 1
                    maxItems: 16
              username:
                type: string
                maxLength: 1024
              credential:
                type: string
                maxLength: 1024
            required:
              - urls
            additionalProperties: false
          minItems: 1
          maxItems: 16
        expiresAt:
          type: string
          format: date-time
      required:
        - iceServers
      additionalProperties: false
    HelpImage:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
      required:
        - id
        - expiresAt
      additionalProperties: false
    HelpImageList:
      type: object
      properties:
        images:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              expiresAt:
                type: string
                format: date-time
            required:
              - id
              - expiresAt
            additionalProperties: false
      required:
        - images
      additionalProperties: false
    LanguageList:
      type: object
      properties:
        languages:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              nameNative:
                type: string
              nameEn:
                type: string
              script:
                type: string
              dir:
                type: string
                enum:
                  - ltr
                  - rtl
              status:
                type: string
                enum:
                  - live
                  - beta
                  - draft
              stt:
                type: boolean
              tts:
                type: boolean
              voice:
                type:
                  - object
                  - "null"
                properties:
                  engine:
                    type: string
                    enum:
                      - browser
                  bcp_tag:
                    type: string
                    minLength: 2
                    maxLength: 35
                required:
                  - engine
                  - bcp_tag
                additionalProperties: false
                description: Reviewed browser declaration when at least one voice direction is
                  enabled; otherwise null. The BCP 47 tag must match the pack
                  language and script.
            required:
              - code
              - nameNative
              - nameEn
              - script
              - dir
              - status
              - stt
              - tts
              - voice
            additionalProperties: false
      required:
        - languages
      additionalProperties: false
    LocaleUI:
      type: object
      additionalProperties:
        type: string
    LocaleFAQ:
      type: object
      properties:
        lang:
          type: string
          minLength: 2
          maxLength: 35
        dir:
          type: string
          enum:
            - ltr
            - rtl
        contentVersion:
          type: string
          minLength: 1
          maxLength: 256
        reviewedOn:
          type:
            - string
            - "null"
          pattern: ^\d{4}-\d{2}-\d{2}$/u
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              question:
                type: string
                minLength: 1
                maxLength: 1000
              answer:
                type: string
                minLength: 1
                maxLength: 4000
              citations:
                type: array
                items:
                  type: object
                  properties:
                    passageId:
                      type: string
                      minLength: 1
                      maxLength: 256
                    label:
                      type: string
                      minLength: 1
                      maxLength: 1000
                    url:
                      type: string
                      maxLength: 4000
                      pattern: ^https?:\/\//iu
                    sourceLang:
                      type: string
                      minLength: 1
                      maxLength: 35
                    sourceType:
                      type: string
                      enum:
                        - course
                    timestamp:
                      type: number
                  required:
                    - passageId
                    - label
                    - url
                    - sourceLang
                    - sourceType
                  additionalProperties: false
                minItems: 1
                maxItems: 1
            required:
              - id
              - question
              - answer
              - citations
            additionalProperties: false
          maxItems: 100
      required:
        - lang
        - dir
        - contentVersion
        - reviewedOn
        - items
      additionalProperties: false
    JobImportRequest:
      type: object
      properties:
        lang:
          type: string
          minLength: 2
          maxLength: 35
        postings: {}
      required:
        - lang
        - postings
      additionalProperties: false
    JobImportResponse:
      type: object
      properties:
        imported:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
              reason:
                type: string
            required:
              - index
              - reason
            additionalProperties: false
      required:
        - imported
        - errors
      additionalProperties: false
    Jobs:
      type: object
      properties:
        jobs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              description:
                type: string
              organization:
                type: string
              location:
                type: string
              region:
                type:
                  - string
                  - "null"
              jobType:
                type:
                  - string
                  - "null"
              datePosted:
                type: string
              deadline:
                type:
                  - string
                  - "null"
              deadlineDisplay:
                type:
                  - string
                  - "null"
              url:
                type: string
                format: uri
              lang:
                type: string
                minLength: 2
                maxLength: 35
              accommodationsOffered:
                type: array
                items:
                  type: string
            required:
              - id
              - title
              - description
              - organization
              - location
              - region
              - jobType
              - datePosted
              - deadline
              - deadlineDisplay
              - url
              - lang
              - accommodationsOffered
            additionalProperties: false
        channels:
          type: array
          items:
            type: string
            enum:
              - sms
              - telegram
        relayAvailable:
          type: boolean
        glossary:
          type: array
          items:
            type: object
            properties:
              term:
                type: string
              meaning:
                type: string
            required:
              - term
              - meaning
            additionalProperties: false
      required:
        - jobs
        - channels
        - relayAvailable
        - glossary
      additionalProperties: false
    SubscriptionRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 8
          maxLength: 128
        clientRequestId:
          type: string
          minLength: 8
          maxLength: 128
        jobType:
          type: string
          minLength: 1
          maxLength: 120
        region:
          type: string
          minLength: 1
          maxLength: 120
        lang:
          type: string
          minLength: 2
          maxLength: 35
        channel:
          type: string
          enum:
            - sms
            - telegram
        contact:
          type: string
          minLength: 1
          maxLength: 128
        consent:
          type: object
          properties:
            accepted:
              type: boolean
              enum:
                - true
            noticeVersion:
              type: string
              enum:
                - job-alerts-v1
          required:
            - accepted
            - noticeVersion
          additionalProperties: false
      required:
        - sessionId
        - clientRequestId
        - lang
        - channel
        - contact
        - consent
      additionalProperties: false
    Subscription:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - active
            - stopped
      required:
        - id
        - status
      additionalProperties: false
    AccommodationRequest:
      oneOf:
        - type: object
          properties:
            action:
              type: string
              enum:
                - draft
            sessionId:
              type: string
              minLength: 8
              maxLength: 128
            clientRequestId:
              type: string
              minLength: 8
              maxLength: 128
            jobId:
              type: string
              minLength: 1
              maxLength: 128
            lang:
              type: string
              minLength: 2
              maxLength: 35
            needs:
              type: array
              items:
                type: string
                enum:
                  - sign_language_interpreter
                  - step_free_access
                  - written_questions
                  - extra_time
                  - screen_reader_friendly_test
                  - other
              minItems: 1
              maxItems: 6
            otherText:
              type: string
              minLength: 1
              maxLength: 1000
            name:
              type: string
              minLength: 1
              maxLength: 80
            interviewAt:
              type: string
              format: date-time
          required:
            - action
            - sessionId
            - clientRequestId
            - jobId
            - lang
            - needs
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              enum:
                - resume
            sessionId:
              type: string
              minLength: 8
              maxLength: 128
            id:
              type: string
              minLength: 8
              maxLength: 128
          required:
            - action
            - sessionId
            - id
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              enum:
                - cancel
            sessionId:
              type: string
              minLength: 8
              maxLength: 128
            id:
              type: string
              minLength: 8
              maxLength: 128
          required:
            - action
            - sessionId
            - id
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              enum:
                - approve
            sessionId:
              type: string
              minLength: 8
              maxLength: 128
            id:
              type: string
              minLength: 8
              maxLength: 128
            revision:
              type: integer
              exclusiveMinimum: 0
          required:
            - action
            - sessionId
            - id
            - revision
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              enum:
                - send
            sessionId:
              type: string
              minLength: 8
              maxLength: 128
            id:
              type: string
              minLength: 8
              maxLength: 128
            revision:
              type: integer
              exclusiveMinimum: 0
          required:
            - action
            - sessionId
            - id
            - revision
          additionalProperties: false
    Accommodation:
      type: object
      properties:
        id:
          type: string
        revision:
          type: integer
          exclusiveMinimum: 0
        status:
          type: string
          enum:
            - draft
            - approved
            - sent
            - cancelled
        sendAttempted:
          type: boolean
        message:
          type: string
        jobId:
          type: string
        lang:
          type: string
          minLength: 2
          maxLength: 35
        needs:
          type: array
          items:
            type: string
            enum:
              - sign_language_interpreter
              - step_free_access
              - written_questions
              - extra_time
              - screen_reader_friendly_test
              - other
          maxItems: 6
        otherText:
          type: string
        name:
          type: string
        interviewAt:
          type: string
        interviewDisplay:
          type: string
      required:
        - id
        - revision
        - status
        - sendAttempted
        - message
        - jobId
        - lang
        - needs
      additionalProperties: false
  parameters: {}
paths:
  /v1/telegram/webhook:
    post:
      summary: Receive authenticated Telegram private-chat updates
      description: Authenticate the standard secret header before parsing up to 64 KiB
        of JSON. Nonprivate and unsupported update kinds are acknowledged
        without effects. Supported private text, voice and callbacks use the
        same durable channel service as local polling. No identifiers or message
        content appear in acknowledgments. Malformed or spoofed private updates
        are rejected. Local delivery receipts suppress replay; ambiguous
        upstream sends are not blindly retried.
      security:
        - telegramWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                update_id:
                  type: integer
                  minimum: 0
                message:
                  type: object
                  properties:
                    message_id:
                      type: integer
                      exclusiveMinimum: 0
                    date:
                      type: integer
                      minimum: 0
                    chat:
                      type: object
                      properties:
                        id:
                          type: integer
                        type:
                          type: string
                          enum:
                            - private
                            - group
                            - supergroup
                            - channel
                        first_name:
                          type: string
                          maxLength: 256
                        last_name:
                          type: string
                          maxLength: 256
                        username:
                          type: string
                          maxLength: 64
                        title:
                          type: string
                          maxLength: 256
                        is_forum:
                          type: boolean
                        is_direct_messages:
                          type: boolean
