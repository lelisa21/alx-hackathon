                        type: string
                        enum: *a5
                      minItems: 1
                      maxItems: 6
                    otherText:
                      type: string
                      minLength: 1
                      maxLength: 1000
                    name:
                      type: string
                      minLength: 1
                      maxLength: 80
                    interviewAt:
                      type: string
