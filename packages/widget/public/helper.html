<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dimts helper console</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23164e63'/%3E%3Cpath d='M9 8h7a8 8 0 0 1 0 16H9z' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef3f5;
        --bar: #002b56;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a141f;
          --bar: #0f1b2d;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        background: var(--bar);
        color: #fff;
      }
      header a {
        color: inherit;
        font-weight: 700;
        text-decoration: none;
      }
      main {
        max-inline-size: 60rem;
        margin: 1.5rem auto;
        padding-inline: 1rem;
      }
    </style>
  </head>
  <body>
    <header><a href="/">← Dimts</a><span>Helper console</span></header>
    <main>
      <dimts-helper-console
        data-api="/v1"
        data-language="en"
      ></dimts-helper-console>
    </main>
    <script type="module" src="/dimts-helper-console.js"></script>
  </body>
</html>
