# Help chat uses a WebSocket on /v1/help/ws; forward the upgrade handshake.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Match the compressed transfer budgets and throttled startup fixture.
  gzip on;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/javascript application/javascript text/css application/json;

  location /v1/ {
    proxy_pass http://api:3000/v1/;
    proxy_http_version 1.1;
    # $http_host keeps the port so generated links (docs, LTI) are correct.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The help socket can stay idle while a learner waits for a helper.
    proxy_read_timeout 1h;
  }

  location = /sim/sms {
    try_files /sim/sms/index.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
