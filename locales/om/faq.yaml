# Draft answers sourced only from content/sample-course/study-plan.md. Nine distinct facts; not the 30-entry live-pack gate.
- q: Torban kana mata duree meeqa filachuu qaba?
  a: Torban kana barachuuf mata duree tokko filadhaa.
  source: study-plan#choose-one-goal-0
- q: Kaayyoo qo'annoo koo akkamitti barreessuu qaba?
  a: Kaayyoo keessan hima gabaabaadhaan barreessaa.
  source: study-plan#choose-one-goal-0
- q: Kaayyoon qo'annoo koo maaliif ifa ta'uu qaba?
  a: Kaayyoon ifaan itti aansuun maal qo'achuu akka qabdan murteessuuf isin gargaara.
  source: study-plan#choose-one-goal-0
- q: Yeroo qo'annoo akkamitti filadha?
  a: Yeroo qo'annoo gabaabaa torban keessaniif mijatu muraasa filadhaa.
  source: study-plan#make-a-small-schedule-1
- q: Yeroo qo'annoo koo eessatti galmeessuu qaba?
  a: Yeroo qo'annoo hunda kalaandarii irratti galmeessaa.
  source: study-plan#make-a-small-schedule-1
- q: Yeroo qo'annoo gidduutti maaliif boqonnaa kaa'uu qaba?
  a: Boqochuu fi irra deebi'uuf yeroo gidduu kaa'aa.
  source: study-plan#make-a-small-schedule-1
- q: Guddina koo yoom ilaaluun qaba?
  a: Dhuma torbaniitti waan barattan ilaalaa.
  source: study-plan#review-your-progress-2
- q: Guddina koo ergan ilaalee booda maal jijjiiruu qaba?
  a: Waan milkaa'e itti fufaa. Waan qo'annoo rakkise tokko jijjiiraa.
  source: study-plan#review-your-progress-2
- q: Ergan torban ilaalee booda maal godhu?
  a: Kaayyoo xiqqaa itti aanu filadhaa.
  source: study-plan#review-your-progress-2
