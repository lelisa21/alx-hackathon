name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm lang:check
      - run: pnpm test:lang
      - run: pnpm test:core
      - run: pnpm eval
      - run: pnpm build
      - run: pnpm size
      - name: Start local database
        run: docker compose --profile local up -d --wait db
        env:
          POSTGRES_PASSWORD: dimts-ci-only
      - name: Check database health
        run: docker compose --profile local exec -T db pg_isready -U dimts -d dimts
      - name: Apply database migrations
        run: pnpm migrate
        env:
          DATABASE_URL_DIRECT: postgres://dimts:dimts-ci-only@localhost:5432/dimts
      - name: Verify migrations are idempotent
        run: pnpm migrate
        env:
          DATABASE_URL_DIRECT: postgres://dimts:dimts-ci-only@localhost:5432/dimts
      - name: Verify API against PostgreSQL
        run: pnpm exec vitest run packages/api/test/*.integration.test.ts --maxWorkers=1
        env:
          DIMTS_TEST_DATABASE_URL: postgresql://dimts:dimts-ci-only@localhost:5432/dimts
      - name: Stop local database
        if: always()
        run: docker compose --profile local down --volumes
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run widget and axe matrix
        run: pnpm a11y
      - name: Verify clean-machine Compose startup and restart
        run: pnpm test:compose
      - run: pnpm audit --audit-level high
      - name: Scan for secrets
        if: always()
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
