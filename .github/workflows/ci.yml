name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Compose keeps its database on an internal network with no host port, so
    # CI uses a service container (blueprint 2.6) for migration and API tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dimts
          POSTGRES_USER: dimts
          POSTGRES_PASSWORD: dimts-ci-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U dimts -d dimts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm lang:check
      - run: pnpm test:lang
      - run: pnpm test:core
      - run: pnpm eval
      - run: pnpm build
      - run: pnpm size
      - name: Apply database migrations
        run: pnpm migrate
        env:
          DATABASE_URL_DIRECT: postgres://dimts:dimts-ci-only@localhost:5432/dimts
      - name: Verify migrations are idempotent
        run: pnpm migrate
        env:
          DATABASE_URL_DIRECT: postgres://dimts:dimts-ci-only@localhost:5432/dimts
      - name: Verify API against PostgreSQL
        run: pnpm exec vitest run packages/api/test/*.integration.test.ts --maxWorkers=1
        env:
          DIMTS_TEST_DATABASE_URL: postgresql://dimts:dimts-ci-only@localhost:5432/dimts
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run widget and axe matrix
        run: pnpm a11y
      - name: Verify clean-machine Compose startup and restart
        run: pnpm test:compose
      - run: pnpm audit --audit-level high
      - name: Scan for secrets
        if: always()
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
