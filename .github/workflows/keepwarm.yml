name: Bounded keepwarm

on:
  schedule:
    - cron: "*/10 5-16 14-15 11 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepwarm:
    runs-on: ubuntu-latest
    steps:
      - name: Check the event window and ping health
        env:
          DIMTS_API_URL: ${{ secrets.DIMTS_API_URL }}
        run: |
          test -n "$DIMTS_API_URL"
          today="$(date -u +%F)"
          hhmm="$(date -u +%H%M)"
          case "$today" in
            2026-11-14|2026-11-15) ;;
            *) echo "Outside the configured event dates; skipping."; exit 0 ;;
          esac
          if [ "$hhmm" -lt 500 ] || [ "$hhmm" -gt 1650 ]; then
            echo "Outside the configured UTC window; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --connect-timeout 10 \
            --max-time 120 --retry 2 \
            "${DIMTS_API_URL%/}/v1/health"
