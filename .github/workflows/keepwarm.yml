# Bounded keep-warm for the event window only (blueprint 14.1, FREE_TIER.md):
# every 10 minutes, 05:00-16:50 UTC, on 14 and 15 November. Uses the public
# health route and the DIMTS_API_URL repository secret; skips when unset.
name: keepwarm

on:
  schedule:
    - cron: "*/10 5-16 14,15 11 *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DIMTS_API_URL: ${{ secrets.DIMTS_API_URL }}
    steps:
      - name: Request the health route
        run: |
          if [ -z "$DIMTS_API_URL" ]; then
            echo "::notice::DIMTS_API_URL is not set; skipping."
            exit 0
          fi
          curl --silent --show-error --max-time 120 \
            -o /dev/null -w "health: HTTP %{http_code}\n" \
            "${DIMTS_API_URL%/}/v1/health" || true
