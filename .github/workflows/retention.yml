name: Retention

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - name: Run retention sweep
        env:
          DIMTS_API_URL: ${{ secrets.DIMTS_API_URL }}
          DIMTS_CRON_SECRET: ${{ secrets.DIMTS_CRON_SECRET }}
        run: |
          test -n "$DIMTS_API_URL"
          test -n "$DIMTS_CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 120 \
            --request POST "${DIMTS_API_URL%/}/v1/internal/retention" \
            --header "Authorization: Bearer ${DIMTS_CRON_SECRET}"
